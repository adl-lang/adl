# The rust crates of this repo: the adl runtime, its companion proc macro
# crate, and the suite that compiles the golden generated code.
#
# A workspace so that one `cargo build` covers all three, and so that the
# dependencies the runtime and the test suite share are stated once.
[workspace]
resolver = "2"
members = [
    "runtime",
    "runtime-derive",
    "tests",
]

# Shared by the two published crates. They are released together, because
# adl_rt re-exports adl_rt_derive, so the version lives here too.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/adl-lang/adl"
authors = ["Tim Docker <tim@dockerz.net>"]

[workspace.dependencies]
base64 = "0.21.2"
serde = { version = "1.0", features = ["derive"] }
